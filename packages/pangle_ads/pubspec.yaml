name: pangle_ads
description: 博简自用的穿山甲（GroMore）原生广告通道，提供开屏与 Banner 能力。
version: 0.1.0
homepage: https://github.com/fahnzjan/bojian-mobile
publish_to: 'none'

environment:
  sdk: ^3.13.5
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: cn.kelance.pangle_ads
        pluginClass: PangleAdsPlugin
      ios:
        pluginClass: PangleAdsPlugin

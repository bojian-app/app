group 'cn.kelance.pangle_ads'
version '0.1.0'

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'cn.kelance.pangle_ads'
    compileSdk 35

    defaultConfig {
        // 穿山甲 GroMore 7.x 要求 minSdk >= 21。
        minSdk 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 与宿主工程保持一致：Kotlin 2.x 用 compilerOptions 而不是已废弃的 kotlinOptions。
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // GroMore 融合 SDK（含穿山甲 ADN 与 GM ADX）。版本需与后台「接入与测试 → SDK」一致。
    implementation 'com.pangle.cn:mediation-sdk:7.8.1.4'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
